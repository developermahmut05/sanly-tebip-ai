<!DOCTYPE html>
<html lang="tk" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanly Tebip AI - Mobile</title>
    <script src="./tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#020617',
                        emeraldPrimary: '#10b981',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#020617] h-screen overflow-hidden flex flex-col font-sans text-slate-300">

    <!-- MOBIL HEADER -->
    <header class="h-16 flex items-center justify-between px-4 bg-[#020617]/80 backdrop-blur-md border-b border-white/5 z-20 shrink-0">
        <div class="flex items-center gap-3">
            <!-- Menýu düwmesi (Sidebar açmak üçin) -->
            <button onclick="toggleSidebar()" class="p-2 text-emerald-500 hover:bg-white/5 rounded-xl">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
            <h2 class="font-black text-sm tracking-[0.2em] text-emerald-500 uppercase">Sanly Tebip AI</h2>
        </div>
        <!-- Täze söhbet düwmesi -->
        <button onclick="startNewChat()" class="p-2 bg-emerald-500/10 text-emerald-500 rounded-xl">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </button>
    </header>

    <!-- SIDEBAR (Çepden açylýan taryh menýusy) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-[#020617] border-r border-white/10 transform -translate-x-full transition-transform duration-300 flex flex-col">
        <div class="h-16 flex items-center justify-between px-6 border-b border-white/5">
            <span class="text-xs font-black text-emerald-500 uppercase tracking-widest"> Öňki Söhbetdeşlik </span>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-2">✕</button>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- JS arkaly doldurylar -->
        </div>
    </aside>

    <!-- OVERLAY -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden"></div>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col relative overflow-hidden bg-[#020617]">
        
        <!-- Chat Window -->
        <div id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Bot Message -->
            <div class="flex items-start gap-3 max-w-full">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex-shrink-0 flex items-center justify-center text-lg shadow-lg shadow-emerald-500/20">
                    👨‍⚕️
                </div>
                <div class="bg-white/[0.03] border border-white/10 p-4 rounded-2xl rounded-tl-none text-slate-100 text-[13px] leading-relaxed shadow-xl">
                    Salam! Men Sanly-Tebip atly emeli aň ulgamy. Size nähili dermanlyk ösümlik ýa-da saglyk barada kömek edip bilerin?
                </div>
            </div>
        </div>

        <!-- Input Area (Mikrofon we Ugrat düwmeli täzelenen mobil görnüş) -->
        <div class="p-3 bg-[#020617] border-t border-white/5 z-20">
            <div class="relative flex items-center">
                <input type="text" id="user-msg" placeholder="Dermanlyk ösümlik ya-da kesel soraň..." 
                    class="w-full bg-[#0d1324] border border-white/10 rounded-full pl-4 pr-24 py-3 outline-none focus:border-emerald-500/50 text-white text-[13px] placeholder:text-slate-500">
                
                <div class="absolute right-1.5 flex items-center gap-1">
                    <!-- Send Button -->
                    <button id="send-btn" class="w-9 h-9 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full flex items-center justify-center transition-all shadow-md active:scale-95" title="Ugrat">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>

                    <!-- Mic Button -->
                    <button id="mic-btn" class="w-9 h-9 bg-rose-600 hover:bg-rose-500 text-white rounded-full flex items-center justify-center transition-all shadow-md active:scale-95 text-sm" title="Ses ýazmak">
                        🎤
                    </button>
                </div>
            </div>
            <div id="mic-status" class="text-center text-[10px] text-slate-400 mt-1.5 font-medium"></div>
        </div>
    </main>

    <!-- Same JavaScript logic -->
    <script src="./script.js"></script>
    <script>
        // Sidebar açyp-ýapmak üçin ýönekeý funksiýa
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    </script>
</body>
</html>
