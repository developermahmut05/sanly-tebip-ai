<!DOCTYPE html>
<html lang="tk" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanly Tebip AI - Mobile</title>
     <script src="./tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#030e17',
                        emeraldPrimary: '#10b981',
                    }
                }
            }
        }
    </script>
    <style>
        /* 1-nji suratdaky ýaly ýagtyly zümrüt Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030e17;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            border-radius: 9999px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #34d399;
        }
    </style>
</head>
<body class="bg-[#030e17] h-screen overflow-hidden flex flex-col font-sans text-slate-200">

    <!-- MOBIL HEADER -->
    <header class="h-16 flex items-center justify-between px-5 bg-[#030e17]/90 backdrop-blur-xl border-b border-emerald-500/10 z-20 shrink-0 shadow-lg">
        <div class="flex items-center gap-3">
            <!-- Menýu düwmesi -->
            <button onclick="toggleSidebar()" class="p-2.5 text-emerald-400 hover:bg-emerald-500/10 rounded-xl transition-colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 bg-emerald-400 rounded-full shadow-[0_0_10px_#10b981] animate-pulse"></div>
                <h2 class="font-black text-sm tracking-[0.15em] text-emerald-400 uppercase">SANLY TEBIP AI</h2>
            </div>
        </div>
        <!-- Täze söhbet düwmesi -->
        <button onclick="startNewChat()" class="p-2.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 rounded-xl transition-all shadow-sm active:scale-95" title="Täze söhbet">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </button>
    </header>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-[#020b12] border-r border-emerald-500/10 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="h-16 flex items-center justify-between px-6 border-b border-emerald-500/10">
            <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Öňki Söhbetdeşlik</span>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-2 text-lg font-semibold">✕</button>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- JS arkaly doldurylar -->
        </div>
    </aside>

    <!-- OVERLAY -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity"></div>

    <!-- MAIN CHAT AREA (2-nji suratdaky arka fon reňki) -->
    <main class="flex-1 flex flex-col relative overflow-hidden bg-gradient-to-b from-[#030e17] via-[#02131d] to-[#010911]">
        
        <!-- Chat Window -->
        <div id="chat-window" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 relative z-10">
            <div class="flex items-start gap-4 max-w-3xl mx-auto group">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex-shrink-0 flex items-center justify-center shadow-[0_0_25px_rgba(16,185,129,0.3)] text-xl transform group-hover:scale-105 transition-transform duration-300">
                    👨‍⚕️
                </div>
                
                <div class="space-y-3 pt-1 flex-1">
                    <div class="bg-[#051824]/80 backdrop-blur-xl p-6 rounded-2xl rounded-tl-none border border-emerald-500/15 leading-relaxed text-slate-100 shadow-xl text-[15px] md:text-base">
                        Salam! Men <span class="text-emerald-400 font-bold">Sanly Tebip</span> emeli aň ulgamy. Gahryman Arkadagymyzyň «Türkmenistanyň dermanlyk ösümlikleri» ensiklopediýasynyň esasynda döredilen bu ulgam arkaly dermanlyk ösümlikler we saglyk barada maglumat alyp bilersiňiz. Size nähili kömek edip bilerin?
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-[#020d15]/90 backdrop-blur-md border-t border-emerald-500/10 z-20">
            <div class="relative flex items-center max-w-3xl mx-auto">
                <input type="text" id="user-msg" placeholder="Dermanlyk ösümlik ýa-da keseller barada soraň..." 
                    class="w-full bg-[#051622] border border-emerald-500/20 rounded-2xl pl-5 pr-16 py-3.5 outline-none focus:border-emerald-500/60 focus:ring-2 focus:ring-emerald-500/20 text-white text-[10px] placeholder:text-slate-400 transition-all shadow-inner">
                
                <div class="absolute right-2 flex items-center">
                    <button id="send-btn" class="w-10 h-10 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white rounded-xl flex items-center justify-center transition-all shadow-[0_4px_12px_rgba(16,185,129,0.3)] active:scale-95" title="Ugrat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript logic -->
    <script src="./script.js"></script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    </script>
</body>
</html>
